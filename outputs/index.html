function saved(){return `<section class="page">${pageTitle('Reusable discovery','Saved searches.','Keep search configurations handy; public API results refresh separately.',`<button class="soft-btn" data-view="discover">＋ New search</button>`)}<div class="panel"><div class="activity-list"><div class="activity"><span class="activity-icon">⌕</span><div><b>Creative businesses · US & Canada</b><small>Design, branding · creator workflow · saved Oct 30</small></div><button class="soft-btn" data-action="reuseSearch">Run</button></div><div class="activity"><span class="activity-icon">⌕</span><div><b>Founder podcasts · UK & Ireland</b><small>Business, education · interview format · saved Oct 24</small></div><button class="soft-btn" data-action="reuseSearch">Run</button></div><div class="activity"><span class="activity-icon">⌕</span><div><b>Technology creators · International</b><small>Technology, SaaS · English · saved Oct 19</small></div><button class="soft-btn" data-action="reuseSearch">Run</button></div></div></div><p class="source-note">Saved items store query settings only, not long-term copies of YouTube data.</p></section>`}
function settings(){return `<section class="page">${pageTitle('Workspace preferences','Settings.','Tune your workspace defaults and research preferences.') }<div class="content-grid" style="grid-template-columns:1fr 1fr"><div class="panel"><div class="panel-head"><div><h3>Research defaults</h3><small>Discovery preferences</small></div><span class="stat-icon">⌕</span></div><div class="field" style="margin:14px 0"><label>Target market preset</label><select><option>International preset</option><option>North America</option><option>Europe</option></select></div><div class="field" style="margin:14px 0"><label>Default excluded market</label><select><option>India (when creator-declared)</option><option>None</option></select></div><label style="display:flex;align-items:center;gap:9px;font-size:10px;color:#777"><input type="checkbox" checked> Keep unknown country visible as “Unknown”</label><button class="primary-btn" style="margin-top:18px" data-action="saveSettings">Save preferences</button></div><div class="panel"><div class="panel-head"><div><h3>Opportunity fit score</h3><small>Transparent scoring configuration</small></div><span class="stat-icon" style="background:#e9f7ef;color:#35a772">✳</span></div>${[['Service relevance',25],['Verified service gaps',25],['Buying intent',20],['Operational readiness',15],['Contact route quality',10],['Evidence freshness',5]].map(x=>`<div class="activity" style="grid-template-columns:1fr auto;padding:9px 0"><span style="font-size:10px">${x[0]}</span><b style="font-size:10px">${x[1]}%</b></div>`).join('')}<p class="source-note">Version 1 · Published weights total 100. Scores require evidence; low coverage is marked insufficient.</p></div></div></section>`}
function render(){const host=$('#content');const views={overview,discover,opportunities,crm,tasks,saved,settings};host.innerHTML=(views[currentView]||overview)();bindViewEvents()}
function bindViewEvents(){const query=$('#creatorQuery');if(query)query.addEventListener('input',filterChannels);const country=$('#countryFilter');if(country)country.addEventListener('change',filterChannels);const niche=$('#nicheFilter');if(niche)niche.addEventListener('change',filterChannels);const sort=$('#sortFilter');if(sort)sort.addEventListener('change',sortChannels);const search=$('#searchBtn');if(search)search.addEventListener('click',runDiscovery);document.querySelectorAll('[data-query]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-query]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');if(query){query.value=b.dataset.query;filterChannels()}});document.querySelectorAll('[data-bookmark]').forEach(b=>b.onclick=()=>{const name=b.dataset.bookmark;savedChannels.has(name)?savedChannels.delete(name):savedChannels.add(name);b.classList.toggle('saved');b.textContent=savedChannels.has(name)?'★':'☆';toast(savedChannels.has(name)?'Saved to discovery bookmarks':'Removed from bookmarks')});const oppSearch=$('#oppSearch'),oppStage=$('#oppStage'),oppService=$('#oppService');[oppSearch,oppStage,oppService].filter(Boolean).forEach(el=>el.addEventListener('input',filterOpportunities));const crmSearch=$('#crmSearch'),crmFilter=$('#crmStageFilter');[crmSearch,crmFilter].filter(Boolean).forEach(el=>el.addEventListener('input',filterCrm));document.querySelectorAll('[data-crm-mode]').forEach(b=>b.onclick=()=>{crmMode=b.dataset.crmMode;render()});document.querySelectorAll('.stage-select').forEach(sel=>sel.onchange=()=>{prospects[Number(sel.dataset.index)].stage=sel.value;toast('Pipeline stage updated');render()});document.querySelectorAll('[data-prospect]').forEach(b=>b.onclick=()=>openProspect(b.dataset.prospect));document.querySelectorAll('.task-row .check').forEach(b=>b.onclick=()=>{const i=Number(b.closest('.task-row').dataset.task);checkedTasks.has(i)?checkedTasks.delete(i):checkedTasks.add(i);render()});bindDrag()}
function filterChannels(){const q=($('#creatorQuery')?.value||'').toLowerCase().trim(),country=$('#countryFilter')?.value||'International preset',niche=$('#nicheFilter')?.value||'All topics';let count=0;document.querySelectorAll('.creator').forEach(card=>{const ok=(!q||card.dataset.search.includes(q)||card.dataset.search.includes(q.split(' ')[0]))&&(country==='International preset'||card.dataset.country===country)&&(niche==='All topics'||card.dataset.niche===niche);card.style.display=ok?'':'none';if(ok)count++});const rc=$('#resultCount');if(rc)rc.textContent=`${count} example ${count===1?'channel':'channels'}`;const sub=$('#resultsSub');if(sub)sub.textContent=q?`Examples that match “${q}” and your filters.`:'A small sample to help you try the filters.';const empty=$('#noResults');if(empty)empty.hidden=count!==0}
function sortChannels(){const grid=$('#creatorGrid');if(!grid)return;const cards=[...grid.children],mode=$('#sortFilter').value;cards.sort((a,b)=>{const av=parseFloat(a.querySelector('.creator-stats b').textContent),bv=parseFloat(b.querySelector('.creator-stats b').textContent);return mode==='Subscribers: high to low'?bv-av:mode==='Subscribers: low to high'?av-bv:0});cards.forEach(c=>grid.appendChild(c))}
function runDiscovery(){const progress=$('#searchProgress'),btn=$('#searchBtn');if(!progress||!btn)return;const q=$('#creatorQuery').value.trim();progress.innerHTML=`<div class="search-running"><span><i class="pulse-dot"></i> Looking through example channels${q?` for “${esc(q)}”`:''}…</span><button class="link-btn" data-action="cancelSearch">Cancel</button></div><div class="loadingline run"><i></i></div>`;btn.disabled=true;btn.textContent='Searching…';discoveryTimer=setTimeout(()=>{if(!$('#searchBtn'))return;btn.disabled=false;btn.innerHTML='Find channels <span aria-hidden="true">↗</span>';progress.innerHTML='<div class="search-done">✓ Search complete. These are sample results; live YouTube search is not connected.</div>';filterChannels();toast('Search complete')},1150)}
function cancelDiscovery(){clearTimeout(discoveryTimer);const btn=$('#searchBtn'),progress=$('#searchProgress');if(btn){btn.disabled=false;btn.innerHTML='Find channels <span aria-hidden="true">↗</span>'}if(progress)progress.innerHTML='';toast('Search cancelled')}
function filterOpportunities(){const q=($('#oppSearch')?.value||'').toLowerCase(),s=$('#oppStage')?.value||'All stages',svc=$('#oppService')?.value||'All services';document.querySelectorAll('.opp-card').forEach(c=>c.style.display=((!q||c.dataset.name.includes(q))&&(s==='All stages'||c.dataset.stage===s)&&(svc==='All services'||c.dataset.service===svc))?'':'none')}
function filterCrm(){const q=($('#crmSearch')?.value||'').toLowerCase(),s=$('#crmStageFilter')?.value||'All stages';document.querySelectorAll('[data-crm-name]').forEach(r=>r.style.display=((!q||r.dataset.crmName.includes(q))&&(s==='All stages'||r.dataset.crmStage===s))?'':'none')}
function bindDrag(){document.querySelectorAll('.kanban-card').forEach(card=>{card.ondragstart=e=>{e.dataTransfer.setData('text/plain',card.dataset.drag)} });document.querySelectorAll('.kanban-col').forEach(col=>{col.ondragover=e=>e.preventDefault();col.ondrop=e=>{e.preventDefault();const i=Number(e.dataTransfer.getData('text/plain'));prospects[i].stage=col.dataset.column;render();toast('Prospect moved to '+col.dataset.column)}})}
function modal(title,subtitle,fields,submitText,callback){$('#modalRoot').innerHTML=`<div class="modal-backdrop" data-close="1"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div><h2>${title}</h2><p>${subtitle}</p></div><button class="close" data-close="1" aria-label="Close">×</button></div><form id="modalForm"><div class="form-grid">${fields}</div><div class="modal-actions"><button type="button" class="soft-btn" data-close="1">Cancel</button><button class="primary-btn">${submitText}</button></div></form></section></div>`;$('#modalRoot').querySelectorAll('[data-close]').forEach(x=>x.onclick=e=>{if(e.target.dataset.close)$('#modalRoot').innerHTML=''});$('#modalForm').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget));callback(data);$('#modalRoot').innerHTML=''}}
function openProspect(name){const p=prospects.find(x=>x.name===name);if(!p)return;modal(esc(p.name),'Independent evidence and opportunity fit.',`<div class="field full"><label>Opportunity fit</label><div class="pill ${p.score>=80?'green':'blue'}">${p.score?`${p.score}/100 · ${p.score>=80?'Strong opportunity':'Potential opportunity'}`:'Insufficient evidence'}</div><small style="font-size:9px;color:#888">Confidence shown separately · 58% evidence coverage</small></div><div class="field full"><label>Business evidence</label><textarea readonly>${esc(p.evidence)}\n\nSource: Public business website · checked recently. This observation is editable and should be verified before outreach.</textarea></div><div class="field"><label>Business category</label><input readonly value="${esc(p.type)}"></div><div class="field"><label>Target service</label><input readonly value="${esc(p.service)}"></div><div class="field full"><label>Pipeline stage</label><select name="stage">${['New Prospect','Researching','Qualified','Contact Ready','Contacted','Follow-up','Interested','Negotiation','Won','Lost'].map(s=>`<option ${p.stage===s?'selected':''}>${s}</option>`).join('')}</select></div>`,`Save changes`,d=>{p.stage=d.stage;render();toast('Prospect updated')})}
function newProspect(){modal('Add independent prospect','Enter a business you researched independently.',`<div class="field"><label>Business name *</label><input name="name" required placeholder="e.g. Brightline Studio"></div><div class="field"><label>Business category</label><input name="type" placeholder="e.g. Creative studio"></div><div class="field"><label>Target service</label><select name="service"><option>Website development</option><option>Video editing</option><option>SEO</option><option>AI automation</option><option>Branding</option></select></div><div class="field"><label>Business website</label><input name="website" type="url" placeholder="https://"></div><div class="field full"><label>Independent evidence / observation</label><textarea name="evidence" placeholder="What did you observe? Add source notes."></textarea></div><div class="field"><label>Initial stage</label><select name="stage"><option>New Prospect</option><option>Researching</option></select></div><div class="field"><label>Independent source</label><input name="source" placeholder="Business website"></div>`,`Add prospect`,d=>{prospects.unshift({name:d.name,type:d.type||'Business',stage:d.stage,service:d.service,score:0,updated:'Just now',evidence:d.evidence||'Evidence not yet recorded.'});$('#crmCount').textContent=prospects.length;render();toast('Independent prospect added')})}
function addTask(){modal('Add a reminder','Create a follow-up for your independent pipeline.',`<div class="field full"><label>Next action</label><input required name="task" placeholder="e.g. Review the service page"></div><div class="field"><label>Business</label><select name="business">${prospects.map(p=>`<option>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Due date</label><input name="date" type="date"></div>`,`Add reminder`,()=>{toast('Reminder added to your task list')})}
function exportCsv(){const rows=[['Business','Category','Service','Stage','Opportunity Fit Score','Updated','Independent Evidence'],...prospects.map(p=>[p.name,p.type,p.service,p.stage,p.score,p.updated,p.evidence])];const csv=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='leadsense-independent-prospects.csv';a.click();URL.revokeObjectURL(a.href);toast('Independent CRM CSV exported')}
document.addEventListener('click',e=>{const view=e.target.closest('[data-view]');if(view){e.preventDefault();setView(view.dataset.view);return}const channel=e.target.closest('[data-channel]')?.dataset.channel;if(channel){openChannel(channel);return}const act=e.target.closest('[data-action]')?.dataset.action;if(act==='newProspect')newProspect();if(act==='addTask')addTask();if(act==='exportCsv')exportCsv();if(act==='saveSearch')toast('Search settings saved');if(act==='reuseSearch')setView('discover');if(act==='saveSettings')toast('Preferences saved');if(act==='workspace')toast('Northstar Studio workspace');if(act==='notifications')toast('You’re all caught up');if(act==='palette')toast('Try search filters to explore your workspace');if(act==='cancelSearch')cancelDiscovery()});
$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(currentView==='discover')$('#creatorQuery')?.focus();else {setView('discover');setTimeout(()=>$('#creatorQuery')?.focus(),50)}}if(e.key==='Escape')$('#modalRoot').innerHTML=''});render();
</script>
<script>
// MVP wiring: this page stays usable in demo mode and switches to live/server data when configured.
window.discover = function(){return `<section class="page discovery-page"><div class="discovery-hero"><div class="discovery-copy"><span class="discovery-kicker"><i class="pulse-dot"></i> YouTube discovery</span><h1>Find creators<br><span>worth a closer look.</span></h1><p>Search public channels by topic. Choose a search region, then check each creator’s declared country.</p><div id="serviceState" class="service-state"><span class="state-chip"><i class="dot"></i> Checking app setup…</span></div></div><div class="discovery-illustration" aria-hidden="true"><div class="disco-ring"></div><div class="disco-leaf"></div><div class="disco-core"></div><div class="disco-sun"></div><div class="disco-diamond"></div><div class="disco-tag"><b>Topic</b> · Design<br><b>Region</b> · US</div></div></div><div class="discovery-box"><div class="discovery-box-head"><strong>What do you want to find?</strong><span>Use a topic, format, or phrase</span></div><div class="discover-form"><div class="searchbox"><span>⌕</span><input id="creatorQuery" placeholder="e.g. design tutorials, founder podcasts…" value=""></div><button class="primary-btn blue" id="searchBtn">Find channels <span aria-hidden="true">↗</span></button></div><div class="search-suggestions"><span class="hint">Try one of these</span><button class="tag selected" data-query="business podcast">Business podcasts</button><button class="tag" data-query="design tutorials">Design tutorials</button><button class="tag" data-query="founder stories">Founder stories</button><button class="tag" data-query="technology explainers">Tech explainers</button></div><div class="discovery-divider"></div><div class="refine-row"><span class="refine-label">Search region</span><select id="regionFilter" aria-label="Choose a YouTube search region">${Object.entries(countryCodes).filter(([n])=>n!=='India').map(([name,code])=>`<option value="${code}" ${code==='US'?'selected':''}>${name}</option>`).join('')}</select><span class="refine-label">Show country</span><select id="countryFilter" aria-label="Filter by creator-declared country"><option value="all">Any country</option>${Object.entries(countryCodes).filter(([n])=>n!=='India').map(([name,code])=>`<option value="${code}">${name}</option>`).join('')}<option value="unknown">Unknown</option></select><select id="nicheFilter" aria-label="Choose a topic"><option>All topics</option><option>Business</option><option>Design</option><option>Technology</option><option>Lifestyle</option></select><select id="sortFilter" aria-label="Sort channels"><option>Default order</option><option>Subscribers: high to low</option><option>Subscribers: low to high</option></select><label class="unknown-toggle"><input id="includeUnknown" type="checkbox" checked> Include unknown countries</label></div><p class="region-help">Search region changes what YouTube shows. It does not tell us where a creator lives. India is hidden when a creator declares India.</p><div id="searchProgress"></div></div><div class="results-heading"><div><h2>Channels to explore</h2><p id="resultsSub">Example channels are here so you can try the page.</p></div><div class="result-count-pill" id="resultCount">6 example channels</div></div><div class="creator-grid" id="creatorGrid">${channels.map(channelCard).join('')}</div><div class="empty" id="noResults" hidden>No channels match these choices. Try another topic or country.</div><div id="loadMoreRoot"></div><div class="demo-banner" id="demoBanner"><span><b>Example data.</b> Add your YouTube API key on the server to search live channels. Example results are not from your search.</span><span class="demo-badge"><i class="dot"></i> Demo mode</span></div><div class="source-note">Channel data comes only from YouTube. It is not scored or copied into your CRM. Hidden or missing country details stay unknown.</div></section>`};

window.channelCard = function(c){const isLive=Boolean(c.channelId),countryCode=isLive?(c.countryCode||'unknown'):(countryCodes[c.country]||'unknown'),countryName=isLive?(countryNames[c.countryCode]||'Unknown'):c.country,avatar=c.thumbnail&&/^https:\/\/(yt3\.ggpht\.com|yt3\.googleusercontent\.com|lh3\.googleusercontent\.com)\//i.test(c.thumbnail)?`<img class="creator-thumb" loading="lazy" src="${esc(c.thumbnail)}" alt="">`:`<div class="creator-avatar">${esc(c.initials||c.name.split(/\s/).map(x=>x[0]).join('').slice(0,2).toUpperCase())}</div>`,queryLabel=isLive?'Search result':c.niche;const number=n=>n===null||n===undefined?'Not public':new Intl.NumberFormat('en').format(Number(n));return `<article class="creator" data-country="${esc(countryCode)}" data-niche="${esc(c.niche||'') }" data-search="${esc((c.name+' '+(c.desc||'')).toLowerCase())}"><div class="creator-head">${avatar}<div><h3>${esc(c.name)}</h3><span class="handle">${esc(c.handle||c.customUrl||c.channelId||'YouTube channel')}</span></div><button class="bookmark ${savedChannels.has(c.channelId||c.name)?'saved':''}" data-bookmark="${esc(c.channelId||c.name)}" title="Save search result" aria-label="Save channel">${savedChannels.has(c.channelId||c.name)?'★':'☆'}</button></div><p>${esc(c.desc||'No public channel description.')}</p><div class="tag-list"><span class="pill blue">${esc(queryLabel)}</span><span class="pill">${esc(countryName||'Unknown')}</span></div><div class="creator-stats"><span>Subscribers<b>${isLive?number(c.subs):esc(c.subs)}</b></span><span>Channel views<b>${isLive?number(c.views):esc(c.views)}</b></span><span>Videos<b>${isLive?number(c.videos):esc(c.videos)}</b></span></div><div class="creator-foot"><small>${isLive?'Fetched just now · YouTube API':`${esc(c.fresh)} · example`}</small>${isLive?`<a class="link-btn" href="${esc(c.channelUrl)}" target="_blank" rel="noopener noreferrer">Open on YouTube ↗</a>`:`<button class="link-btn" data-channel="${esc(c.name)}">Channel details ↗</button>`}</div></article>`};

window.bindViewEvents = function(){const query=$('#creatorQuery'),country=$('#countryFilter'),niche=$('#nicheFilter'),unknown=$('#includeUnknown'),sort=$('#sortFilter'),search=$('#searchBtn');if(query)query.oninput=filterChannels;if(country)country.onchange=filterChannels;if(niche)niche.onchange=filterChannels;if(unknown)unknown.onchange=filterChannels;if(sort)sort.onchange=sortChannels;if(search)search.onclick=runDiscovery;document.querySelectorAll('[data-query]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-query]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');if(query){query.value=b.dataset.query;query.focus();filterChannels()}});document.querySelectorAll('[data-bookmark]').forEach(b=>b.onclick=()=>{const name=b.dataset.bookmark;savedChannels.has(name)?savedChannels.delete(name):savedChannels.add(name);b.classList.toggle('saved');b.textContent=savedChannels.has(name)?'★':'☆';toast(savedChannels.has(name)?'Saved for this browser':'Removed from saved channels')});const oppSearch=$('#oppSearch'),oppStage=$('#oppStage'),oppService=$('#oppService');[oppSearch,oppStage,oppService].filter(Boolean).forEach(el=>el.oninput=filterOpportunities);const crmSearch=$('#crmSearch'),crmFilter=$('#crmStageFilter');[crmSearch,crmFilter].filter(Boolean).forEach(el=>el.oninput=filterCrm);document.querySelectorAll('[data-crm-mode]').forEach(b=>b.onclick=()=>{crmMode=b.dataset.crmMode;render()});document.querySelectorAll('.stage-select').forEach(sel=>sel.onchange=async()=>{const p=prospects[Number(sel.dataset.index)],old=p.stage;p.stage=sel.value;if(backendState==='connected'&&p.id){try{await apiRequest(`/api/prospects/${p.id}`,{method:'PATCH',body:JSON.stringify({stage:p.stage})})}catch(e){p.stage=old;toast(e.message)}}else saveDemoState();toast('Pipeline stage updated');render()});document.querySelectorAll('[data-prospect]').forEach(b=>b.onclick=()=>openProspect(b.dataset.prospect));document.querySelectorAll('.task-row .check').forEach(b=>b.onclick=async()=>{const row=b.closest('.task-row'),i=Number(row.dataset.taskIndex),task=taskRecords[i];task.done=!task.done;if(backendState==='connected'&&task.id){try{await apiRequest(`/api/tasks/${task.id}`,{method:'PATCH',body:JSON.stringify({done:task.done})})}catch(e){task.done=!task.done;toast(e.message)}}else saveDemoState();render()});document.querySelectorAll('[data-run-preset]').forEach(b=>b.onclick=()=>runPreset(Number(b.dataset.runPreset)));document.querySelectorAll('[data-remove-preset]').forEach(b=>b.onclick=()=>removePreset(b.dataset.removePreset));bindDrag()};

window.filterChannels = function(){const q=($('#creatorQuery')?.value||'').toLowerCase().trim(),country=$('#countryFilter')?.value||'all',includeUnknown=$('#includeUnknown')?.checked!==false,niche=$('#nicheFilter')?.value||'All topics';let count=0;document.querySelectorAll('.creator').forEach(card=>{const isUnknown=card.dataset.country==='unknown',countryOK=country==='all'||(country==='unknown'?isUnknown:card.dataset.country===country||(isUnknown&&includeUnknown)),topicOK=liveDiscovery||niche==='All topics'||card.dataset.niche===niche,queryOK=!q||card.dataset.search.includes(q)||card.dataset.search.includes(q.split(/\s+/)[0]),ok=countryOK&&topicOK&&queryOK&&(!isUnknown||includeUnknown||country==='unknown');card.style.display=ok?'':'none';if(ok)count++});const rc=$('#resultCount');if(rc)rc.textContent=liveDiscovery?`${count} channel${count===1?'':'s'}`:`${count} example channel${count===1?'':'s'}`;const sub=$('#resultsSub');if(sub)sub.textContent=liveDiscovery?(lastSearchPayload?.query?`Public channels matching “${lastSearchPayload.query}”. Country appears only when creator-declared.`:'Live YouTube results.'):(q?`Examples that match “${q}” and your filters. These are not search results.`:'Example channels are here so you can try the page.');const empty=$('#noResults');if(empty)empty.hidden=count!==0};

window.sortChannels = function(){const grid=$('#creatorGrid');if(!grid)return;const cards=[...grid.children],mode=$('#sortFilter')?.value;cards.sort((a,b)=>{const av=Number(a.querySelector('.creator-stats b')?.textContent.replace(/[^\d]/g,''))||0,bv=Number(b.querySelector('.creator-stats b')?.textContent.replace(/[^\d]/g,''))||0;return mode==='Subscribers: high to low'?bv-av:mode==='Subscribers: low to high'?av-bv:0});cards.forEach(card=>grid.appendChild(card))};

window.renderChannelGrid = function(append=false){const grid=$('#creatorGrid');if(!grid)return;if(!append)grid.innerHTML='';grid.insertAdjacentHTML('beforeend',channels.map(channelCard).join(''));filterChannels();bindViewEvents();const more=$('#loadMoreRoot');if(more)more.innerHTML=liveDiscovery&&nextPageToken?'<div style="text-align:center;margin:18px"><button class="soft-btn" data-action="loadMore">Load more channels</button></div>':'';const banner=$('#demoBanner');if(banner){banner.innerHTML=liveDiscovery?'<span><b>Live YouTube data.</b> This information is shown for research and is refreshed by your search. No channel score is created.</span><span class="demo-badge" style="background:#e8f7ee;color:#27895d"><i class="dot"></i> YouTube API</span>':'<span><b>Example data.</b> Add your YouTube API key on the server to search live channels. Example results are not from your search.</span><span class="demo-badge"><i class="dot"></i> Demo mode</span>'}};

window.runDiscovery = async function(pageToken=null,append=false){const progress=$('#searchProgress'),btn=$('#searchBtn');if(!progress||!btn)return;const raw=($('#creatorQuery')?.value||'').trim(),topic=$('#nicheFilter')?.value||'All topics',query=raw||(topic!=='All topics'?topic:'');if(!query){toast('Type a topic or choose one of the suggestions first.');$('#creatorQuery')?.focus();return}const payload={query,maxResults:20,regionCode:$('#regionFilter')?.value||'US',includeUnknown:$('#includeUnknown')?.checked!==false,excludeIndia:true};if(pageToken)payload.pageToken=pageToken;lastSearchPayload=payload;progress.innerHTML=`<div class="search-running"><span><i class="pulse-dot"></i> Searching YouTube for “${esc(query)}”…</span><button class="link-btn" data-action="cancelSearch">Cancel</button></div><div class="loadingline run"><i></i></div>`;btn.disabled=true;btn.textContent='Searching…';window.discoveryAbort=new AbortController();try{const data=await apiRequest('/api/youtube/search',{method:'POST',body:JSON.stringify(payload),signal:window.discoveryAbort.signal});liveDiscovery=true;nextPageToken=data.nextPageToken||null;searchUsage=data.usage||null;const mapped=(data.items||[]).map(c=>({channelId:c.channelId,name:c.name,desc:c.description,customUrl:c.customUrl,channelUrl:c.channelUrl,countryCode:c.countryCode,country:countryNames[c.countryCode]||'Unknown',thumbnail:c.thumbnail,subs:c.subscribers,views:c.totalViews,videos:c.videoCount,fresh:'Fetched just now',niche:'Search result',handle:c.customUrl||c.channelId,initials:c.name.split(/\s/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}));channels.splice(0,channels.length,...(append?[...channels,...mapped]:mapped));renderChannelGrid(false);progress.innerHTML=`<div class="search-done">Search complete. ${esc(String(mapped.length))} channel${mapped.length===1?'':'s'} found in this page.${searchUsage?` App searches today: ${searchUsage.calls}/${searchUsage.limit}.`:''}</div>`;if(!mapped.length&&data.nextPageToken)$('#loadMoreRoot').innerHTML='<div style="text-align:center;margin:18px"><button class="soft-btn" data-action="loadMore">No matches on this page · try next page</button></div>';toast('YouTube search complete')}catch(error){if(error.name==='AbortError'){progress.innerHTML='<div class="search-done">Search cancelled. No channel results were saved.</div>'}else{liveDiscovery=false;channels.splice(0,channels.length,...sampleChannels);renderChannelGrid(false);const msg=error.code==='YOUTUBE_NOT_CONFIGURED'?'Live search is not connected yet. Add YOUTUBE_API_KEY to the server when you are ready.':error.message;progress.innerHTML=`<div class="search-error">${esc(msg)} Example channels remain below so you can explore the filters.</div>`;toast(error.message)}}finally{if($('#searchBtn')){btn.disabled=false;btn.innerHTML='Find channels <span aria-hidden="true">↗</span>'}}};

window.cancelDiscovery = function(){if(window.discoveryAbort)window.discoveryAbort.abort();clearTimeout(discoveryTimer);const btn=$('#searchBtn');if(btn){btn.disabled=false;btn.innerHTML='Find channels <span aria-hidden="true">↗</span>'}};

window.openChannel = function(ref){const c=channels.find(x=>x.channelId===ref||x.name===ref);if(!c)return;const live=Boolean(c.channelId),country=live?(countryNames[c.countryCode]||'Unknown'):c.country;modal('Channel details',live?'Public information from YouTube':'Example channel · sample data',`<div class="field full"><div class="channel-modal-art"><i></i></div><p style="font-size:11px;line-height:1.65;color:#696870;margin:0">${esc(c.desc||'No public channel description.')}</p></div><div class="field"><label>Declared country</label><input readonly value="${esc(country||'Unknown')}"></div><div class="field"><label>Subscribers</label><input readonly value="${esc(live?(c.subs==null?'Not public':String(c.subs)):String(c.subs))}"></div><div class="field"><label>Total channel views</label><input readonly value="${esc(live?(c.views==null?'Not public':String(c.views)):String(c.views))}"></div><div class="field"><label>Public video count</label><input readonly value="${esc(live?(c.videos==null?'Not public':String(c.videos)):String(c.videos))}"></div><div class="field full"><small style="font-size:9px;line-height:1.5;color:#89888f">Country is only shown when the channel owner declared it. Search region does not prove where a creator lives. This channel is not a CRM prospect.</small></div>`,`Close`,()=>{})};

window.saveDemoState = function(){if(backendState==='connected')return;try{localStorage.setItem('leadsense_demo_v1',JSON.stringify({prospects,tasks:taskRecords,searchPresets}))}catch{}};
window.loadBackendData = async function(){try{const health=await apiRequest('/api/health');backendState=health.database;searchUsage=health.searchUsage||null;if(health.database==='connected'){const [rows,taskRowsData,presetRows]=await Promise.all([apiRequest('/api/prospects'),apiRequest('/api/tasks'),apiRequest('/api/search-presets')]);prospects=rows.map(mapProspect);taskRecords=taskRowsData.map(mapTask);searchPresets=presetRows;$('#crmCount').textContent=prospects.length}else{const local=JSON.parse(localStorage.getItem('leadsense_demo_v1')||'null');if(local){prospects=local.prospects||prospects;taskRecords=local.tasks||taskRecords;searchPresets=local.searchPresets||[]}}}catch(error){backendState='offline';console.warn('LeadSense backend is not available:',error.message)}if(currentView==='discover'){const state=$('#serviceState');if(state)state.innerHTML=`<span class="state-chip ${backendState==='connected'?'good':''}"><i class="dot"></i> ${backendState==='connected'?'Database connected':backendState==='not_configured'?'Demo mode · database not set up':'Database unavailable'}</span><span class="state-chip ${YOUTUBE_CONFIGURED?'good':''}"><i class="dot"></i> ${YOUTUBE_CONFIGURED?'Live YouTube ready':'YouTube key not added'}</span>`}render()};

window.newProspect = function(){modal('Add a business','Only add a business you researched on its own website or another independent source.',`<div class="field"><label>Business name *</label><input name="name" required placeholder="e.g. Brightline Studio"></div><div class="field"><label>Business category</label><input name="type" placeholder="e.g. Creative studio"></div><div class="field"><label>Service you offer</label><select name="service"><option>Website development</option><option>Video editing</option><option>SEO</option><option>AI automation</option><option>Branding</option></select></div><div class="field"><label>Business website</label><input name="website" type="url" placeholder="https://"></div><div class="field full"><label>Your research notes</label><textarea name="evidence" placeholder="What did you see? Add a source link in your notes."></textarea></div><div class="field"><label>Stage</label><select name="stage"><option>New Prospect</option><option>Researching</option></select></div><div class="field"><label>Target market</label><input name="market" placeholder="e.g. United States"></div>`,`Add business`,async d=>{const row={name:d.name,type:d.type||'Business',stage:d.stage,service:d.service,score:null,updated:'Just now',evidence:d.evidence||'No notes yet.',website:d.website};if(backendState==='connected'){try{const saved=await apiRequest('/api/prospects',{method:'POST',body:JSON.stringify({business_name:d.name,category:d.type,target_service:d.service,website:d.website,target_market:d.market,stage:d.stage,notes:d.evidence||''})});prospects.unshift(mapProspect(saved));toast('Business saved to the database')}catch(error){toast(error.message);return}}else{row.id=`demo-${Date.now()}`;prospects.unshift(row);saveDemoState();toast('Saved in this browser demo. Connect Supabase to keep it on the server.')}$('#crmCount').textContent=prospects.length;render()})};

window.addTask = function(){modal('Add a follow-up','Set a reminder for work in your independent business pipeline.',`<div class="field full"><label>What needs to happen?</label><input required name="task" placeholder="e.g. Review the service page"></div><div class="field"><label>Business</label><select name="business">${prospects.map(p=>`<option value="${esc(p.id||'')}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Due date</label><input name="date" type="date"></div>`,`Add follow-up`,async d=>{const selected=prospects.find(p=>p.id===d.business),task={title:d.task,business:selected?.name||'Independent prospect',due:d.date||'No date',due_at:d.date||null,prospect_id:selected?.id||null,done:false};if(backendState==='connected'){try{const saved=await apiRequest('/api/tasks',{method:'POST',body:JSON.stringify({title:task.title,prospect_id:task.prospect_id,due_at:task.due_at})});taskRecords.unshift(mapTask(saved));toast('Follow-up saved')}catch(error){toast(error.message);return}}else{taskRecords.unshift(task);saveDemoState();toast('Follow-up saved in this browser demo')}render()})};

window.saved = function(){return `<section class="page">${pageTitle('Reusable searches','Saved searches.','Save a search setup so you can run it again.',`<button class="soft-btn" data-view="discover">＋ New search</button>`)}<div class="panel"><div class="activity-list">${searchPresets.length?searchPresets.map((p,i)=>`<div class="activity"><span class="activity-icon">⌕</span><div><b>${esc(p.name)}</b><small>${esc(p.query)} · ${esc(countryNames[p.region_code]||'United States')} region · ${esc(countryNames[p.declared_country_code]||(p.country_unknown_only?'Unknown only':'Any country'))}</small></div><button class="soft-btn" data-run-preset="${i}">Run</button><button class="iconbtn" style="width:29px;height:29px" data-remove-preset="${esc(p.id||i)}" aria-label="Remove saved search">×</button></div>`).join(''):'<div class="empty">No saved searches yet. Start a search and choose “Save search”.</div>'}</div></div><p class="source-note">Saved searches keep your words and filters only. YouTube result data is not saved.</p></section>`};

window.saveSearch = function(){const query=$('#creatorQuery')?.value.trim();if(!query){toast('Enter a search phrase first.');$('#creatorQuery')?.focus();return}modal('Save this search','We save the search words and filters, not the YouTube results.',`<div class="field full"><label>Name</label><input name="name" required value="${esc(query.slice(0,70))}"></div><div class="field full"><label>Search phrase</label><input name="query" readonly value="${esc(query)}"></div>`,`Save search`,async d=>{const row={name:d.name,query,region_code:$('#regionFilter')?.value||'US',declared_country_code:$('#countryFilter')?.value&&$('#countryFilter').value!=='all'&&$('#countryFilter').value!=='unknown'?$('#countryFilter').value:null,country_unknown_only:$('#countryFilter')?.value==='unknown',topic:$('#nicheFilter')?.value||null,include_unknown:$('#includeUnknown')?.checked!==false,exclude_declared_india:true};if(backendState==='connected'){try{searchPresets.unshift(await apiRequest('/api/search-presets',{method:'POST',body:JSON.stringify(row)}));toast('Search saved')}catch(error){toast(error.message);return}}else{row.id=`demo-${Date.now()}`;searchPresets.unshift(row);saveDemoState();toast('Search saved in this browser demo')}render()})};
window.runPreset=function(i){const p=searchPresets[i];if(!p)return;setView('discover');setTimeout(()=>{const input=$('#creatorQuery');if(input)input.value=p.query;if($('#regionFilter'))$('#regionFilter').value=p.region_code||'US';if($('#countryFilter'))$('#countryFilter').value=p.country_unknown_only?'unknown':(p.declared_country_code||'all');if($('#includeUnknown'))$('#includeUnknown').checked=p.include_unknown!==false;runDiscovery()},30)};
window.removePreset=async function(id){const p=searchPresets.find(x=>String(x.id||searchPresets.indexOf(x))===String(id));if(!p)return;if(backendState==='connected'&&p.id){try{await apiRequest(`/api/search-presets/${p.id}`,{method:'DELETE'})}catch(e){toast(e.message);return}}searchPresets=searchPresets.filter(x=>x!==p);saveDemoState();render();toast('Saved search removed')};
window.openProspect=function(name){const p=prospects.find(x=>x.name===name);if(!p)return;modal(esc(p.name),'Your independent research and next step.',`<div class="field full"><label>Research notes</label><textarea name="notes">${esc(p.evidence||'')}</textarea></div><div class="field"><label>Business website</label><input name="website" type="url" value="${esc(p.website||'')}"></div><div class="field"><label>Service you offer</label><input name="service" value="${esc(p.service||'')}"></div><div class="field full"><label>Pipeline stage</label><select name="stage">${['New Prospect','Researching','Qualified','Contact Ready','Contacted','Follow-up','Interested','Negotiation','Won','Lost'].map(s=>`<option ${p.stage===s?'selected':''}>${s}</option>`).join('')}</select></div>`,`Save changes`,async d=>{const before={stage:p.stage,evidence:p.evidence,website:p.website,service:p.service};p.stage=d.stage;p.evidence=d.notes||'';p.website=d.website||'';p.service=d.service||'';if(backendState==='connected'&&p.id){try{const row=await apiRequest(`/api/prospects/${p.id}`,{method:'PATCH',body:JSON.stringify({stage:p.stage,notes:p.evidence,website:p.website||null,target_service:p.service})});Object.assign(p,mapProspect(row));toast('Changes saved')}catch(error){Object.assign(p,before);toast(error.message);return}}else{saveDemoState();toast('Changes saved in this browser demo')}render()})};

const originalClickHandler=document.addEventListener.bind(document);document.addEventListener('click',e=>{const act=e.target.closest('[data-action]')?.dataset.action;if(act==='saveSearch'){e.stopImmediatePropagation();saveSearch()}else if(act==='loadMore'){e.stopImmediatePropagation();if(nextPageToken)runDiscovery(nextPageToken,true)}else if(act==='cancelSearch'){e.stopImmediatePropagation();cancelDiscovery()}else if(act==='addTask'){e.stopImmediatePropagation();addTask()}else if(act==='newProspect'){e.stopImmediatePropagation();newProspect()}else if(act==='removePreset'){e.stopImmediatePropagation();removePreset(e.target.closest('[data-remove-preset]')?.dataset.removePreset)}},true);

window.loadBackendData = async function(){try{const health=await apiRequest('/api/health');backendState=health.database;window.youtubeConfigured=health.youtube==='configured';searchUsage=health.searchUsage||null;if(health.database==='connected'){const [rows,taskRowsData,presetRows]=await Promise.all([apiRequest('/api/prospects'),apiRequest('/api/tasks'),apiRequest('/api/search-presets')]);prospects=rows.map(mapProspect);taskRecords=taskRowsData.map(mapTask);searchPresets=presetRows;$('#crmCount').textContent=prospects.length}else{const local=JSON.parse(localStorage.getItem('leadsense_demo_v1')||'null');if(local){prospects=local.prospects||prospects;taskRecords=local.tasks||taskRecords;searchPresets=local.searchPresets||[]}}}catch(error){backendState='offline';window.youtubeConfigured=false;console.warn('LeadSense backend is not available:',error.message)}if(currentView==='discover'){const state=$('#serviceState');if(state)state.innerHTML=`<span class="state-chip ${backendState==='connected'?'good':''}"><i class="dot"></i> ${backendState==='connected'?'Database connected':backendState==='not_configured'?'Demo mode · database not set up':'Database unavailable'}</span><span class="state-chip ${window.youtubeConfigured?'good':''}"><i class="dot"></i> ${window.youtubeConfigured?'Live YouTube ready':'YouTube key not added'}</span>${searchUsage?`<span class="state-chip">App searches today · ${searchUsage.calls}/${searchUsage.limit}</span>`:''}`}render()};
window.updateServiceStatus=function(){const state=$('#serviceState');if(!state)return;state.innerHTML=`<span class="state-chip ${backendState==='connected'?'good':''}"><i class="dot"></i> ${backendState==='connected'?'Database connected':backendState==='not_configured'?'Demo mode · database not set up':backendState==='offline'?'App server not running':backendState==='checking'?'Checking app setup…':'Database unavailable'}</span><span class="state-chip ${window.youtubeConfigured?'good':''}"><i class="dot"></i> ${window.youtubeConfigured?'Live YouTube ready':'YouTube key not added'}</span><span class="state-chip">One shared workspace · no sign-in</span>${searchUsage?`<span class="state-chip">App searches today · ${searchUsage.calls}/${searchUsage.limit}</span>`:''}`};
const loadBackendDataCore=window.loadBackendData;window.loadBackendData=async function(){await loadBackendDataCore();window.updateServiceStatus()};
const runDiscoveryCore=window.runDiscovery;window.runDiscovery=async function(pageToken=null,append=false){const input=$('#creatorQuery'),topic=$('#nicheFilter')?.value;if(input&&topic&&topic!=='All topics'&&!input.value.toLowerCase().includes(topic.toLowerCase()))input.value=`${topic.toLowerCase()} ${input.value}`.trim();return runDiscoveryCore(pageToken,append)};
document.addEventListener('change',e=>{if(e.target?.id==='nicheFilter'&&liveDiscovery)runDiscovery()});
const crmTableCore=window.crmTable;window.crmTable=function(){return prospects.length?crmTableCore():'<div class="panel empty">No businesses yet. Add one after researching its public website.</div>'};
const opportunitiesCore=window.opportunities;window.opportunities=function(){return prospects.length?opportunitiesCore():`<section class="page">${pageTitle('Independent business research','Business opportunities.','Keep notes about businesses you research outside YouTube.',`<button class="primary-btn" data-action="newProspect">＋ Add business</button>`)}<div class="panel empty">No businesses yet. Add an independently researched business to start.</div></section>`};
window.render();window.loadBackendData();
</script>
</body>
</html>
