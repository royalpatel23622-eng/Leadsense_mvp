services:
  - type: web
    name: leadsense-mvp
    runtime: node
    plan: free
    buildCommand: npm ci && npm run check && npm test
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: TRUSTED_CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: YOUTUBE_DAILY_SEARCH_LIMIT
        value: 40
      - key: YOUTUBE_DAILY_OTHER_UNITS_LIMIT
        value: 9000
      - key: API_RATE_LIMIT_PER_MINUTE
        value: 60
      - key: API_AUTH_LOGIN_RATE_LIMIT
        value: 10
      - key: API_AUTH_SIGNUP_RATE_LIMIT
        value: 5
      - key: API_YOUTUBE_SEARCH_RATE_LIMIT
        value: 12
      - key: API_YOUTUBE_INSPECT_RATE_LIMIT
        value: 12
      - key: USER_DAILY_SEARCH_LIMIT
        value: 10
      - key: USER_DAILY_ANALYSIS_LIMIT
        value: 20
      - key: USER_DAILY_API_CALL_LIMIT
        value: 120
