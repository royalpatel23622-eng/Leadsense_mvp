services:
  - type: web
    name: leadsense-mvp
    runtime: node
    plan: free
    buildCommand: npm test
    startCommand: npm start
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: YOUTUBE_DAILY_SEARCH_LIMIT
        value: 40
      - key: API_RATE_LIMIT_PER_MINUTE
        value: 60
      - key: USER_DAILY_SEARCH_LIMIT
        value: 10
      - key: USER_DAILY_ANALYSIS_LIMIT
        value: 20
